modelRoles:
  default: openrouter/deepseek/deepseek-v4.1-flash-1017
  slow: openrofter/openai/gpt-6.2-sol:high
  smol: openrouter/z-ai/glm-5.3-flash:high
  advisor: openrouter/z-ai/glm-5.3-flash
  task: "@default"
  plan: "@slow"
prewalk:
  enabled: true
  auto: suggest
ask:
  enabled: true
  notify: "off"
task:
  structured: true
  enableLsp: true
  isolation:
    enabled: true
astGrep:
  enabled: true
advisor:
  enabled: true
symbolPreset: unicode
composer:
  shape: pi
theme:
  dark: titanium
  light: light
setupVersion: 3
statusLine:
  preset: default
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
completion:
  notify: "off"
bash:
  patterns:
    - match: "*--no-verify*"
      approval: deny
    - match: sudo
      approval: deny
    - match: sudo *
      approval: deny
    - match: git push*
      approval: deny
    - match: git pull*
      approval: deny
    - match: git fetch*
      approval: deny
    - match: git rebase*
      approval: deny
    - match: git merge*
      approval: deny
    - match: git cherry-pick*
      approval: deny
    - match: git reset --hard*
      approval: deny
    - match: env
      approval: deny
    - match: env *
      approval: deny
    - match: printenv*
      approval: deny
    - match: "* .env"
      approval: deny
    - match: "* .env.*"
      approval: deny
    - match: python -c*
      approval: deny
    - match: python3 -c*
      approval: deny
    - match: node -e*
      approval: deny
    - match: node --eval*
      approval: deny
    - match: rm -rf /*
      approval: deny
    - match: rm -f
      approval: deny
    - match: rm -f *
      approval: deny
    - match: rm -rf*
      approval: deny
    - match: rm -fr*
      approval: deny
  gitGuard: true
hideThinkingBlock: true
update:
  auto: false
checkpoint:
  enabled: true
autolearn:
  enabled: true
compaction:
  experimentalContextManagement: true
  thresholdPercent: 35
dev:
  autoqaConsent: denied
memory:
  backend: hindsight
hindsight:
  apiUrl: http://localhost:8888